<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Alunos</title>
</head>

<body>
    <div class="container">
        <header>
            <h1>Painel de Alunos</h1>

            <p>
                Demonstração de CRUD Frontend/Backend (Node.js)
            </p>

            <button
                onclick="window.print()"
                style="
                    margin-top: 1rem;
                    padding: 10px 20px;
                    font-weight: bold;
                    cursor: pointer;
                    border-radius: 8px;
                    border: none;
                    background-color: white;
                    color: var(--primary-color);
                "
            >
                ⬇️ Baixar PDF
            </button>
        </header>

        <main>
            <section class="form-section">
                <h2>Novo Aluno</h2>

                <form id="aluno-form">
                    <input type="hidden" id="aluno-id">

                    <div>
                        <label for="nome">Nome:</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite o nome do aluno"
                            required
                        >
                    </div>

                    <div>
                        <label for="email">E-mail:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite o e-mail"
                            required
                        >
                    </div>

                    <button type="submit">
                        Cadastrar Aluno
                    </button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
