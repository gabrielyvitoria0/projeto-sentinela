```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentinela - Atendimento</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            min-height: 100vh;
        }

        .topo {
            height: 70px;
            background: #17202a;
            display: flex;
            align-items: center;
            padding: 0 45px;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #e63946;
        }

        .topo-texto {
            margin-left: 30px;
            color: #aeb6bf;
            font-size: 14px;
        }

        .conteudo {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .cabecalho {
            margin-bottom: 25px;
        }

        .cabecalho h1 {
            font-size: 30px;
            color: #17202a;
            margin-bottom: 7px;
        }

        .cabecalho p {
            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .titulo-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .icone {
            width: 42px;
            height: 42px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .titulo-card h2 {
            color: #17202a;
            font-size: 19px;
        }

        .titulo-card p {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 3px;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .campo input,
        .campo select {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: #f9fafb;
            outline: none;
            font-size: 14px;
            color: #374151;
            transition: 0.2s;
        }

        .campo input:focus,
        .campo select:focus {
            background: white;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .campo input[type="file"] {
            padding: 10px;
        }

        .campo-grande {
            grid-column: 1 / -1;
        }

        .acoes {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        button {
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 13px 28px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 700px) {

            .topo {
                padding: 0 20px;
            }

            .topo-texto {
                display: none;
            }

            .conteudo {
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .campo-grande {
                grid-column: auto;
            }

            .acoes {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <header class="topo">
        <div class="logo">
            Senti<span>nela</span>
        </div>

        <div class="topo-texto">
            Sistema de prevenção e segurança hospitalar
        </div>
    </header>


    <main class="conteudo">

        <div class="cabecalho">
            <h1>Atendimento</h1>

            <p>
                Cadastre as informações do paciente para iniciar o atendimento.
            </p>
        </div>


        <section class="card">

            <div class="titulo-card">

                <div class="icone">
                    +
                </div>

                <div>
                    <h2>Dados do paciente</h2>

                    <p>
                        Preencha todas as informações necessárias
                    </p>
                </div>

            </div>


            <form class="formulario" onsubmit="cadastrar(event)">

                <div class="campo campo-grande">

                    <label>Nome completo</label>

                    <input
                        id="nome"
                        type="text"
                        placeholder="Digite o nome completo"
                        required
                    >

                </div>


                <div class="campo">

                    <label>CPF</label>

                    <input
                        id="cpf"
                        type="text"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >

                </div>


                <div class="campo">

                    <label>Data de nascimento</label>

                    <input
                        id="dataNascimento"
                        type="date"
                    >

                </div>


                <div class="campo">

                    <label>Sexo</label>

                    <select id="sexo">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Feminino">
                            Feminino
                        </option>

                        <option value="Masculino">
                            Masculino
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>Nome da mãe</label>

                    <input
                        id="nomeMae"
                        type="text"
                        placeholder="Digite o nome da mãe"
                    >

                </div>


                <div class="campo">

                    <label>Estado civil</label>

                    <input
                        id="estadoCivil"
                        type="text"
                        placeholder="Estado civil"
                    >

                </div>


                <div class="campo">

                    <label>Endereço</label>

                    <input
                        id="endereco"
                        type="text"
                        placeholder="Digite o endereço"
                    >

                </div>


                <div class="campo">

                    <label>Telefone</label>

                    <input
                        id="telefone"
                        type="text"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                    >

                </div>


                <div class="campo">

                    <label>E-mail</label>

                    <input
                        id="email"
                        type="email"
                        placeholder="paciente@email.com"
                    >

                </div>


                <div class="campo">

                    <label>Contato de emergência</label>

                    <input
                        id="contatoEmergencia"
                        type="text"
                        placeholder="Nome e telefone"
                    >

                </div>


                <div class="campo">

                    <label>Tipo de atendimento</label>

                    <select id="tipo" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="Convenio">
                            Convênio
                        </option>

                        <option value="Particular">
                            Particular
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>Foto do paciente</label>

                    <input
                        type="file"
                        id="foto"
                        accept="image/*"
                    >

                </div>


                <div class="acoes">

                    <button
                        id="btnEnviar"
                        type="submit"
                    >
                        Enviar para triagem
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script>

        // MÁSCARA CPF
        document.getElementById("cpf").addEventListener("input", function () {

            let valor = this.value.replace(/\D/g, "");

            valor = valor.substring(0, 11);

            if (valor.length > 9) {

                valor = valor.replace(
                    /(\d{3})(\d{3})(\d{3})(\d{0,2})/,
                    "$1.$2.$3-$4"
                );

            } else if (valor.length > 6) {

                valor = valor.replace(
                    /(\d{3})(\d{3})(\d{0,3})/,
                    "$1.$2.$3"
                );

            } else if (valor.length > 3) {

                valor = valor.replace(
                    /(\d{3})(\d{0,3})/,
                    "$1.$2"
                );

            }

            this.value = valor;

        });


        // MÁSCARA TELEFONE
        document.getElementById("telefone").addEventListener("input", function () {

            let valor = this.value.replace(/\D/g, "");

            valor = valor.substring(0, 11);

            if (valor.length > 10) {

                valor = valor.replace(
                    /(\d{2})(\d{5})(\d{4})/,
                    "($1) $2-$3"
                );

            } else if (valor.length > 6) {

                valor = valor.replace(
                    /(\d{2})(\d{4})(\d{0,4})/,
                    "($1) $2-$3"
                );

            } else if (valor.length > 2) {

                valor = valor.replace(
                    /(\d{2})(\d{0,5})/,
                    "($1) $2"
                );

            }

            this.value = valor;

        });


        async function cadastrar(event) {

            event.preventDefault();

            const botao = document.getElementById("btnEnviar");

            botao.disabled = true;

            botao.textContent = "Enviando...";


            const paciente = {

                nome: document.getElementById("nome").value.trim(),

                cpf: document.getElementById("cpf").value.trim(),

                dataNascimento:
                    document.getElementById("dataNascimento").value,

                sexo:
                    document.getElementById("sexo").value,

                nomeMae:
                    document.getElementById("nomeMae").value.trim(),

                estadoCivil:
                    document.getElementById("estadoCivil").value.trim(),

                endereco:
                    document.getElementById("endereco").value.trim(),

                telefone:
                    document.getElementById("telefone").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                contatoEmergencia:
                    document.getElementById("contatoEmergencia").value.trim(),

                tipo:
                    document.getElementById("tipo").value

            };


            try {

                /*
                 * IMPORTANTE:
                 * Antes estava usando:
                 *
                 * http://localhost:3000/atendimento
                 *
                 * Agora usamos a rota relativa.
                 */
                const response = await fetch("/atendimento", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(paciente)

                });


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.erro || "Não foi possível cadastrar o paciente."
                    );

                }


                alert(
                    "Paciente cadastrado com sucesso!\n\n" +
                    "O paciente foi enviado para a fila da triagem."
                );


                document.querySelector("form").reset();


                console.log("Paciente cadastrado:", data);


            } catch (error) {

                console.error("Erro:", error);

                alert(
                    "Erro ao enviar o atendimento.\n\n" +
                    "Verifique se o servidor está funcionando."
                );

            } finally {

                botao.disabled = false;

                botao.textContent = "Enviar para triagem";

            }

        }

    </script>

</body>

</html>
```
