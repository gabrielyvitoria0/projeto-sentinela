<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentinela - Atendimento</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            min-height: 100vh;
        }

        /* TOPO */

        .topo {
            height: 70px;
            background: #17202a;
            display: flex;
            align-items: center;
            padding: 0 45px;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #e63946;
        }

        .topo-texto {
            margin-left: 30px;
            color: #aeb6bf;
            font-size: 14px;
        }

        /* CONTEÚDO */

        .conteudo {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .cabecalho {
            margin-bottom: 25px;
        }

        .cabecalho h1 {
            font-size: 30px;
            color: #17202a;
            margin-bottom: 7px;
        }

        .cabecalho p {
            color: #6b7280;
            font-size: 14px;
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .titulo-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .icone {
            width: 42px;
            height: 42px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .titulo-card h2 {
            color: #17202a;
            font-size: 19px;
        }

        .titulo-card p {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 3px;
        }

        /* FORMULÁRIO */

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .campo input,
        .campo select {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: #f9fafb;
            outline: none;
            font-size: 14px;
            color: #374151;
            transition: 0.2s;
        }

        .campo input:focus,
        .campo select:focus {
            background: white;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .campo input[type="file"] {
            padding: 10px;
        }

        /* CAMPO GRANDE */

        .campo-grande {
            grid-column: 1 / -1;
        }

        /* BOTÃO */

        .acoes {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        button {
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 13px 28px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        /* RESPONSIVO */

        @media (max-width: 700px) {

            .topo {
                padding: 0 20px;
            }

            .topo-texto {
                display: none;
            }

            .conteudo {
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .campo-grande {
                grid-column: auto;
            }

            .acoes {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <!-- TOPO -->

    <header class="topo">

        <div class="logo">
            Senti<span>nela</span>
        </div>

        <div class="topo-texto">
            Sistema de prevenção e segurança hospitalar
        </div>

    </header>


    <!-- CONTEÚDO -->

    <main class="conteudo">

        <div class="cabecalho">

            <h1>Atendimento</h1>

            <p>
                Cadastre as informações do paciente para iniciar o atendimento.
            </p>

        </div>


        <!-- CARD DO FORMULÁRIO -->

        <section class="card">

            <div class="titulo-card">

                <div class="icone">
                    +
                </div>

                <div>
                    <h2>Dados do paciente</h2>

                    <p>
                        Preencha todas as informações necessárias
                    </p>
                </div>

            </div>


            <form class="formulario" onsubmit="cadastrar(event)">

                <div class="campo campo-grande">
                    <label>Nome completo</label>
                    <input
                        id="nome"
                        type="text"
                        placeholder="Digite o nome completo"
                    >
                </div>


                <div class="campo">
                    <label>CPF</label>

                    <input
                        id="cpf"
                        type="text"
                        placeholder="000.000.000-00"
                    >
                </div>


                <div class="campo">
                    <label>Data de nascimento</label>

                    <input
                        id="dataNascimento"
                        type="date"
                    >
                </div>


                <div class="campo">
                    <label>Sexo</label>

                    <select id="sexo">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Feminino">
                            Feminino
                        </option>

                        <option value="Masculino">
                            Masculino
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                </div>


                <div class="campo">
                    <label>Nome da mãe</label>

                    <input
                        id="nomeMae"
                        type="text"
                        placeholder="Digite o nome da mãe"
                    >
                </div>


                <div class="campo">
                    <label>Estado civil</label>

                    <input
                        id="estadoCivil"
                        type="text"
                        placeholder="Estado civil"
                    >
                </div>


                <div class="campo">
                    <label>Endereço</label>

                    <input
                        id="endereco"
                        type="text"
                        placeholder="Digite o endereço"
                    >
                </div>


                <div class="campo">
                    <label>Telefone</label>

                    <input
                        id="telefone"
                        type="text"
                        placeholder="(00) 00000-0000"
                    >
                </div>


                <div class="campo">
                    <label>E-mail</label>

                    <input
                        id="email"
                        type="email"
                        placeholder="paciente@email.com"
                    >
                </div>


                <div class="campo">
                    <label>Contato de emergência</label>

                    <input
                        id="contatoEmergencia"
                        type="text"
                        placeholder="Nome e telefone"
                    >
                </div>


                <div class="campo">
                    <label>Tipo de atendimento</label>

                    <select id="tipo">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Convenio">
                            Convênio
                        </option>

                        <option value="Particular">
                            Particular
                        </option>

                    </select>

                </div>


                <div class="campo">
                    <label>Foto do paciente</label>

                    <input
                        type="file"
                        id="foto"
                    >
                </div>


                <div class="acoes">

                    <button type="submit">
                        Enviar para triagem
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script>

        function cadastrar(event) {

            event.preventDefault();

            fetch("http://localhost:3000/atendimento", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    nome: document.getElementById("nome").value,

                    cpf: document.getElementById("cpf").value,

                    dataNascimento:
                        document.getElementById("dataNascimento").value,

                    sexo:
                        document.getElementById("sexo").value,

                    nomeMae:
                        document.getElementById("nomeMae").value,

                    estadoCivil:
                        document.getElementById("estadoCivil").value,

                    endereco:
                        document.getElementById("endereco").value,

                    telefone:
                        document.getElementById("telefone").value,

                    email:
                        document.getElementById("email").value,

                    contatoEmergencia:
                        document.getElementById("contatoEmergencia").value,

                    tipo:
                        document.getElementById("tipo").value

                })

            })

            .then(response => response.json())

            .then(data => {

                alert("Paciente enviado para triagem!");

                console.log(data);

            })

            .catch(error => {

                console.error(error);

                alert("Erro ao cadastrar paciente.");

            });

        }

    </script>

</body>

</html>
