<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Atendimento</title>
</head>

<body>
    <div class="container">
        <h2>Atendimento</h2>

        <input id="nome" placeholder="Nome">
        <input id="cpf" placeholder="CPF">
        <input id="dataNascimento" type="date">
        
        <select id="sexo">
            <option value="">Sexo</option>
            <option value="Feminino">Feminino</option>
            <option value="Masculino">Masculino</option>
            <option value="Outro">Outro</option>
        </select>

        <input id="nomeMae" placeholder="Nome da mãe">
        <input id="estadoCivil" placeholder="Estado civil">
        <input id="endereco" placeholder="Endereço">
        <input id="telefone" placeholder="Telefone">
        <input id="email" type="email" placeholder="E-mail">
        <input id="contatoEmergencia" placeholder="Contato de emergência">

        <select id="tipo">
            <option value="Convenio">Convênio</option>
            <option value="Particular">Particular</option>
        </select>

        <input type="file" id="foto">

        <button onclick="cadastrar()">Cadastrar</button>
    </div>
    
    <script>
        function cadastrar() {
            fetch("http://localhost:3000/atendimento", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: document.getElementById("nome").value,
                    cpf: document.getElementById("cpf").value,
                    dataNascimento: document.getElementById("dataNascimento").value,
                    sexo: document.getElementById("sexo").value,
                    nomeMae: document.getElementById("nomeMae").value,
                    estadoCivil: document.getElementById("estadoCivil").value,
                    endereco: document.getElementById("endereco").value,
                    telefone: document.getElementById("telefone").value,
                    email: document.getElementById("email").value,
                    contatoEmergencia: document.getElementById("contatoEmergencia").value,
                    tipo: document.getElementById("tipo").value
                })
            })
            .then(response => response.json())
            .then(data => {
                alert("Paciente enviado para triagem!");
                console.log(data);
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Erro ao cadastrar paciente.");
            });
        }
    </script>
</body>
</html>
