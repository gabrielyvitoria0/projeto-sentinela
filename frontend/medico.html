<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* ==============================
       ESTILO GERAL
    ============================== */

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    /* ==============================
       CABEÇALHO
    ============================== */

    .cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .cabecalho h2 {
      margin: 0;
      color: #1f2937;
    }

    .botoes-cabecalho {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ==============================
       BOTÃO TV
    ============================== */

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    /* ==============================
       BOTÃO PDF
    ============================== */

    .btn-pdf {
      background: #6f42c1;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-pdf:hover {
      background: #59339d;
    }

    /* ==============================
       CONSULTÓRIO
    ============================== */

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      background: #f0f4ff;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
      flex-wrap: wrap;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* ==============================
       CARDS DOS PACIENTES
    ============================== */

    .card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .card h3 {
      margin-top: 0;
      color: #2563eb;
    }

    .card p {
      margin: 7px 0;
    }

    /* ==============================
       BOTÕES
    ============================== */

    .card button,
    .btn-salvar {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .card button:hover,
    .btn-salvar:hover {
      background: #1d4ed8;
    }

    /* ==============================
       BOTÃO CHAMAR NA TV
    ============================== */

    .btn-tv {
      background: #28a745 !important;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-tv:hover {
      background: #1e7e34 !important;
    }

    /* ==============================
       BOTÃO INTERNAÇÃO
    ============================== */

    .btn-internacao {
      background: #7c3aed !important;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-internacao:hover {
      background: #6d28d9 !important;
    }

    /* ==============================
       BOTÃO DE ALTA
    ============================== */

    .btn-alta {
      background: #dc3545;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-alta:hover {
      background: #b02a37;
    }

    /* ==============================
       ÁREA DE CONSULTA
    ============================== */

    .consulta {
      margin-top: 20px;
    }

    .consulta h3 {
      color: #1f2937;
      margin-bottom: 15px;
    }

    .consulta input,
    .consulta select,
    .consulta textarea {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .consulta textarea {
      min-height: 100px;
      resize: vertical;
    }

    .acoes-consulta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    /* ==============================
       RISCO
    ============================== */

    .alto {
      color: #dc3545;
      font-weight: bold;
    }

    .medio {
      color: #f0ad4e;
      font-weight: bold;
    }

    .baixo {
      color: #28a745;
      font-weight: bold;
    }

    /* ==============================
       IMPRESSÃO
    ============================== */

    @media print {

      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        max-width: 100%;
        padding: 10px;
      }

      .botoes-cabecalho,
      .btn-tv,
      .btn-alta,
      .btn-internacao,
      .acoes-consulta,
      .consultorio-input {
        display: none !important;
      }

      input,
      select,
      textarea {
        border: 1px solid #999;
      }

      .card {
        box-shadow: none;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- CABEÇALHO -->

    <div class="cabecalho">

      <h2>🩺 Painel Médico</h2>

      <div class="botoes-cabecalho">

        <button
          class="btn-abrir-tv"
          onclick="window.open('tv.html', '_blank')">
          📺 Abrir Tela da TV
        </button>

        <button
          class="btn-pdf"
          onclick="window.print()">
          📄 Baixar PDF
        </button>

      </div>

    </div>


    <!-- CONSULTÓRIO -->

    <div class="consultorio-input">

      <label>Meu Consultório:</label>

      <input
        type="text"
        id="consultorio-num"
        value="01">

      <span style="color:#666; font-size:13px;">
        Este número será exibido na TV ao chamar o paciente.
      </span>

    </div>


    <!-- LISTA DE TRIAGENS -->

    <div id="triagens"></div>

    <hr>


    <!-- CONSULTA -->

    <div class="consulta">

      <h3>Consulta</h3>

      <input
        id="paciente"
        placeholder="Paciente"
        readonly>

      <input
        id="diagnostico"
        placeholder="Diagnóstico">

      <select id="medicacao">

        <option value="">
          Selecione a medicação
        </option>

      </select>

      <textarea
        id="obs"
        placeholder="Observações"></textarea>


      <!-- BOTÕES -->

      <div class="acoes-consulta">

        <button
          class="btn-salvar"
          onclick="salvar()">
          💾 Salvar
        </button>

        <button
          class="btn-internacao"
          onclick="encaminharInternacao()">
          🏥 Internação
        </button>

        <button
          class="btn-alta"
          onclick="encaminharAlta()">
          🏥 Encaminhar para Alta
        </button>

      </div>

    </div>

  </div>


  <script>

    let triagensCarregadas = [];


    /* ==============================
       CARREGAR TRIAGENS
    ============================== */

    function carregar() {

      fetch("/triagens")

        .then(r => r.json())

        .then(data => {

          triagensCarregadas = data;

          const div =
            document.getElementById("triagens");

          div.innerHTML = "";


          if (data.length === 0) {

            div.innerHTML =
              "<p style='color:#888; text-align:center;'>Nenhum paciente na fila.</p>";

            return;
          }


          data.forEach((t, index) => {

            div.innerHTML += `

              <div class="card">

                <h3>${t.nome}</h3>

                <p>
                  <b>Sintoma:</b>
                  ${t.sintoma || "Não informado"}
                </p>

                <p>
                  <b>Temperatura:</b>
                  ${t.temperatura || "Não informada"}°C
                </p>

                <p>
                  <b>Risco:</b>
                  <span class="${t.risco}">
                    ${t.risco}
                  </span>
                </p>

                <p>
                  <b>Alergia:</b>
                  ${t.alergia || "Nenhuma"}
                </p>

                <p>
                  <b>Observação:</b>
                  ${t.observacao || "Nenhuma"}
                </p>

                <div style="display:flex; gap:8px; flex-wrap:wrap;">

                  <button onclick="selecionar(${index})">
                    👨‍⚕️ Atender
                  </button>

                  <button
                    class="btn-tv"
                    onclick="chamarNaTV('${t.nome}')">
                    📺 Chamar na TV
                  </button>

                </div>

              </div>

            `;

          });

        })

        .catch(error => {

          console.error(
            "Erro ao carregar triagens:",
            error
          );

        });

    }


    /* ==============================
       CHAMAR NA TV
    ============================== */

    function chamarNaTV(nome) {

      const consultorio =
        document.getElementById("consultorio-num").value || "01";


      fetch("/tv/chamar", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          localTipo: "CONSULTÓRIO",

          localNumero: consultorio,

          paciente: nome

        })

      })

      .then(r => r.json())

      .then(() => {

        alert(
          "✅ " +
          nome +
          " foi chamado na TV para o Consultório " +
          consultorio +
          "!"
        );

      });

    }


    /* ==============================
       SELECIONAR PACIENTE
    ============================== */

    function selecionar(index) {

      const t =
        triagensCarregadas[index];


      document.getElementById("paciente").value =
        t.nome;


      document.getElementById("obs").value =
        t.observacao || "";


      if (t.alergia && t.alergia !== "Nenhuma") {

        alert(
          "⚠️ Paciente possui alergia: " +
          t.alergia
        );

      }

    }


    /* ==============================
       CARREGAR MEDICAÇÕES
    ============================== */

    function carregarMedicacoes() {

      fetch("/lista-medicacoes")

        .then(r => r.json())

        .then(data => {

          const select =
            document.getElementById("medicacao");


          select.innerHTML =
            `<option value="">Selecione a medicação</option>`;


          data.forEach(med => {

            const option =
              document.createElement("option");


            option.value = med;

            option.textContent = med;


            select.appendChild(option);

          });

        });

    }


    /* ==============================
       SALVAR CONSULTA
    ============================== */

    function salvar() {

      const paciente =
        document.getElementById("paciente").value;

      const diagnostico =
        document.getElementById("diagnostico").value;

      const medicacao =
        document.getElementById("medicacao").value;

      const obs =
        document.getElementById("obs").value;


      if (!paciente) {

        alert(
          "Selecione um paciente clicando em Atender."
        );

        return;
      }


      if (!medicacao) {

        alert(
          "Selecione uma medicação."
        );

        return;
      }


      fetch("/consulta", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          paciente,
          diagnostico,
          medicacao,
          obs

        })

      })

      .then(r => r.json())

      .then(() => {

        alert("✅ Consulta salva!");

        document.getElementById("diagnostico").value = "";

        document.getElementById("medicacao").value = "";

        document.getElementById("obs").value = "";

      });

    }


    /* ==============================
       INTERNAÇÃO
    ============================== */

    function encaminharInternacao() {

      const paciente =
        document.getElementById("paciente").value;


      if (!paciente) {

        alert(
          "⚠️ Selecione um paciente clicando em Atender."
        );

        return;

      }


      // Guarda o paciente selecionado
      localStorage.setItem(
        "pacienteInternacao",
        paciente
      );


      // Abre a página de internação
      window.location.href =
        "internacao.html";

    }


    /* ==============================
       ALTA
    ============================== */

    function encaminharAlta() {

      const paciente =
        document.getElementById("paciente").value;


      if (!paciente) {

        alert(
          "⚠️ Selecione um paciente clicando em Atender."
        );

        return;
      }


      alert(
        "🏥 " +
        paciente +
        " foi encaminhado para alta médica."
      );

    }


    /* ==============================
       INICIALIZAÇÃO
    ============================== */

    carregar();

    carregarMedicacoes();


    setInterval(
      carregar,
      10000
    );

  </script>

</body>

</html>
