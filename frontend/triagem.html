<!DOCTYPE html>
<html lang="pt-BR">

    <title>Triagem | Sentinela</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

                );

            width: 95%;

            max-width: 1100px;

        }


        .cabecalho {

            background: white;

            border-radius: 20px;

            padding: 25px 28px;

            border:
                1px solid #f0dce4;

            box-shadow:
                0 12px 35px
                rgba(180,100,130,.10);

            margin-bottom: 20px;

        }


        .cabecalho h1 {

            margin: 0;

            background: white;

            padding: 22px;

            margin-bottom: 20px;

        }


        .fila-titulo {

        .status {

            background: #fff1f5;

            font-weight: bold;

        }


        .paciente-info {

            display: grid;

            grid-template-columns:

            gap: 7px;

            margin-top: 11px;

        }


        .info {

            background: white;

            border:
                1px solid #f0dce4;

            padding: 8px;

            border-radius: 8px;

        }


        .info small {

            display: block;

            color: #a18b94;

            font-size: 9px;

        }


        .info strong {

            display: block;

            margin-top: 2px;

            font-size: 11px;

            color: #51434a;

        }


        .vazio {

            text-align: center;

            padding: 25px;

            color: #9c8991;

            background: #fffafb;

            border-radius: 12px;

        }


        /* ================================
           FORMULÁRIO
        ================================= */

        .triagem-form {

            background: white;

            border-radius: 20px;

            padding: 25px;

            border:
                1px solid #f0dce4;

            box-shadow:
                0 12px 35px
                rgba(180,100,130,.10);

        }


        .triagem-form h2 {

            margin: 0 0 18px;

            color: #b85f82;

            font-size: 19px;

        }


        .paciente-selecionado {

            display: none;

            background:
                linear-gradient(
                    135deg,
                    #fff1f5,
                    #fff9fb

            padding: 15px;

        }


        .paciente-selecionado.ativo {

            display: block;

        }


        .paciente-selecionado strong {

        }


        .dados-completos {

        .dado {

            background: white;

                1px solid #f0dce4;

            padding: 8px;

        }


        .dado small {

            display: block;

            font-size: 9px;

        }


        .dado span {

            margin-top: 3px;

        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

        }


        .campo {

            flex-direction: column;

            gap: 6px;

        .campo-grande {

            grid-column:

        label {

        input,
        select,

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #d987a6;

            box-shadow:
                0 0 0 4px
                rgba(217,135,166,.10);

        textarea {

            min-height: 90px;

        }


        .acoes {

            gap: 10px;

        }


        button {

            border: none;

            border-radius: 11px;

            padding: 12px 17px;

            font-weight: bold;

            cursor: pointer;

        }


        .btn-atualizar {

            background: #f4edf0;

            color: #6f5962;

        }


        .btn-salvar {

            flex: 1;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #df91ae,
                    #bd6688
                );

        }


        #resultado {

            display: none;

            margin-top: 16px;

            padding: 14px;

            border-radius: 12px;

            font-weight: bold;

            text-align: center;

        }


        #resultado.ativo {

            display: block;

        }


        #resultado.verde {

            background: #edf8f1;

            color: #4f8b63;

            border:
                1px solid #cbe8d3;

        }


        #resultado.amarelo {

            background: #fff8e6;

            color: #9a7826;

            border:
                1px solid #eedba4;

        }


        #resultado.vermelho {

            background: #fff0f2;

            color: #b34f60;

            border:
                1px solid #efc8cf;

        }


        @media(max-width:700px) {

            body {

                padding: 15px 10px;

            }


            .grid {

                grid-template-columns: 1fr;

            }


            .campo-grande {

                grid-column: auto;

            }


            .paciente-info,
            .dados-completos {

                grid-template-columns:
                    1fr 1fr;

            }


            .fila-titulo {

                align-items:
                    flex-start;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ============================
         CABEÇALHO
    ============================= -->

    <div class="cabecalho">

        <h1>
            🩺 Triagem Pediátrica
        </h1>

        <p>
            Pacientes enviados pelo atendimento aparecem automaticamente nesta fila.
        </p>

    </div>


    <!-- ============================
         FILA
    ============================= -->

    <section class="fila">

        <div class="fila-titulo">

            <h2>
                Pacientes aguardando triagem
            </h2>

            <span
                class="contador"
                id="contador"
            >
                0 pacientes
            </span>

        </div>


        <div id="fila-pacientes">

            <div class="vazio">
                Carregando pacientes...
            </div>

        </div>


        <div class="acoes">

            <button
                class="btn-atualizar"
                onclick="carregarPacientes()"
            >
                🔄 Atualizar lista
            </button>

        </div>

    </section>


    <!-- ============================
         FORMULÁRIO
    ============================= -->

    <section class="triagem-form">

        <h2>
            Dados da triagem
        </h2>


        <div
            id="pacienteSelecionado"
            class="paciente-selecionado"
        >

            <strong id="nomeSelecionado">
                —
            </strong>


            <div
                class="dados-completos"
                id="dadosCompletos"
            ></div>

        </div>


        <div class="grid">


            <div class="campo campo-grande">

                <label>
                    Paciente
                </label>

                <input
                    id="nome"
                    type="text"
                    placeholder="Selecione um paciente acima"
                    readonly
                >

            </div>


            <div class="campo">

                <label>
                    Sintoma principal
                </label>

                <select id="sintoma">

                    <option value="">
                        Selecione o sintoma
                    </option>

                    <option value="dor_leve">
                        Dor leve
                    </option>

                    <option value="resfriado">
                        Resfriado
                    </option>

                    <option value="coriza">
                        Coriza
                    </option>

                    <option value="tosse">
                        Tosse
                    </option>

                    <option value="febre">
                        Febre
                    </option>

                    <option value="vomito">
                        Vômito
                    </option>

                    <option value="diarreia">
                        Diarreia
                    </option>

                    <option value="falta_ar_moderada">
                        Falta de ar moderada
                    </option>

                    <option value="falta_ar_grave">
                        Falta de ar grave
                    </option>

                    <option value="convulsao">
                        Convulsão
                    </option>

                    <option value="hemorragia">
                        Hemorragia
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>
                    Temperatura (°C)
                </label>

                <input
                    id="temp"
                    type="number"
                    step="0.1"
                    placeholder="Ex.: 37.5"
                >

            </div>


            <div class="campo campo-grande">

                <label>
                    Alergias observadas / confirmadas
                </label>

                <input
                    id="alergia"
                    type="text"
                    placeholder="Ex.: Nenhuma conhecida"
                >

            </div>


            <div class="campo campo-grande">

                <label>
                    Observações da triagem
                </label>

                <textarea
                    id="observacao"
                    placeholder="Descreva informações importantes observadas durante a triagem."
                ></textarea>

            </div>

        </div>


        <div
            id="resultado"
        ></div>


        <div class="acoes">

            <button
                class="btn-salvar"
                onclick="salvar()"
            >
                Salvar triagem
            </button>

        </div>

    </section>


</div>


<script>


    let pacienteSelecionado =
        null;


    /* =====================================
       CARREGAR PACIENTES
    ====================================== */

    async function carregarPacientes() {

        const div =
            document.getElementById(
                "fila-pacientes"
            );


        try {

            const resposta =
                await fetch(
                    "/pacientes"
                );


            if (!resposta.ok) {

                throw new Error();

            }


            const pacientes =
                await resposta.json();


            const fila =
                pacientes.filter(
                    paciente =>
                        paciente.status ===
                        "triagem"
                );


            document
                .getElementById(
                    "contador"
                )
                .textContent =
                fila.length +
                (
                    fila.length === 1
                        ? " paciente"
                        : " pacientes"
                );


            if (
                fila.length === 0
            ) {

                div.innerHTML = `

                    <div class="vazio">

                        🧸 Nenhum paciente
                        aguardando triagem.

                        <br><br>

                        Cadastre um paciente
                        no Atendimento para
                        ele aparecer aqui.

                    </div>

                `;

                return;

            }


            div.innerHTML = "";


            fila.forEach(
                paciente => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "paciente-card";


                    card.onclick =
                        () =>
                            selecionarPaciente(
                                paciente
                            );


                    card.innerHTML = `

                        <div class="paciente-topo">

                            <span class="paciente-nome">

                                ${escapeHTML(
                                    paciente.nome ||
                                    "Paciente sem nome"
                                )}

                            </span>

                            <span class="status">

                                AGUARDANDO

                            </span>

                        </div>


                        <div class="paciente-info">

                            <div class="info">

                                <small>
                                    CPF
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        paciente.cpf ||
                                        "—"
                                    )}
                                </strong>

                            </div>


                            <div class="info">

                                <small>
                                    Data de nascimento
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        paciente.dataNascimento ||
                                        "—"
                                    )}
                                </strong>

                            </div>


                            <div class="info">

                                <small>
                                    Atendimento
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        paciente.tipo ||
                                        "—"
                                    )}
                                </strong>

                            </div>


                            <div class="info">

                                <small>
                                    Responsável
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        paciente.responsavel ||
                                        paciente.nomeMae ||
                                        "—"
                                    )}
                                </strong>

                            </div>


                            <div class="info">

                                <small>
                                    Telefone
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        paciente.paisTelefone ||
                                        ""
                                    )}
                                    ${escapeHTML(
                                        paciente.telefone ||
                                        "—"
                                    )}
                                </strong>

                            </div>


                            <div class="info">

                                <small>
                                    Alergias
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        paciente.alergias ||
                                        "Nenhuma informada"
                                    )}
                                </strong>

                            </div>

                        </div>

                    `;


                    div.appendChild(
                        card
                    );

                }
            );


        } catch (erro) {

            console.error(
                erro
            );


            div.innerHTML = `

                <div class="vazio">

                    ❌ Erro ao carregar
                    os pacientes.

                </div>

            `;

        }

    }


    /* =====================================
       SELECIONAR PACIENTE
    ====================================== */

    function selecionarPaciente(
        paciente
    ) {

        pacienteSelecionado =
            paciente;


        document
            .getElementById(
                "nome"
            )
            .value =
            paciente.nome || "";


        document
            .getElementById(
                "nomeSelecionado"
            )
            .textContent =
            paciente.nome ||
            "Paciente";


        const dados =
            document.getElementById(
                "dadosCompletos"
            );


        dados.innerHTML = `

            <div class="dado">

                <small>
                    CPF
                </small>

                <span>
                    ${escapeHTML(
                        paciente.cpf ||
                        "—"
                    )}
                </span>

            </div>


            <div class="dado">

                <small>
                    RG
                </small>

                <span>
                    ${escapeHTML(
                        paciente.rg ||
                        "—"
                    )}
                </span>

            </div>


            <div class="dado">

                <small>
                    Sexo
                </small>

                <span>
                    ${escapeHTML(
                        paciente.sexo ||
                        "—"
                    )}
                </span>

            </div>


            <div class="dado">

                <small>
                    Peso
                </small>

                <span>
                    ${escapeHTML(
                        paciente.peso
                            ? paciente.peso +
                              " kg"
                            : "—"
                    )}
                </span>

            </div>


            <div class="dado">

                <small>
                    Altura
                </small>

                <span>
                    ${escapeHTML(
                        paciente.altura
                            ? paciente.altura +
                              " cm"
                            : "—"
                    )}
                </span>

            </div>


            <div class="dado">

                <small>
                    Tipo sanguíneo
                </small>

                <span>
                    ${escapeHTML(
                        paciente.tipoSanguineo ||
                        "—"
                    )}
                </span>

            </div>


            <div class="dado">

                <small>
                    Medicamentos
                </small>

                <span>
                    ${escapeHTML(
                        paciente.medicamentos ||
                        "Nenhum informado"
                    )}
                </span>

            </div>


            <div class="dado">

                <small>
                    Vacinação
                </small>

                <span>
                    ${escapeHTML(
                        paciente.vacinacao ||
                        "—"
                    )}
                </span>

            </div>


            <div class="dado">

                <small>
                    Responsável
                </small>

                <span>
                    ${escapeHTML(
                        paciente.responsavel ||
                        paciente.nomeMae ||
                        "—"
                    )}
                </span>

            </div>

        `;


        document
            .getElementById(
                "pacienteSelecionado"
            )
            .classList.add(
                "ativo"
            );


        document
            .getElementById(
                "alergia"
            )
            .value =
            paciente.alergias ||
            "";


        window.scrollTo({

            top:
                document
                    .querySelector(
                        ".triagem-form"
                    )
                    .offsetTop - 20,

            behavior:
                "smooth"

        });

    }


    /* =====================================
       RISCO
    ====================================== */

    function classificarRisco(
        sintoma,
        temperatura
    ) {

        const vermelhos = [

            "convulsao",
            "hemorragia",
            "falta_ar_grave"

        ];


        const amarelos = [

            "febre",
            "vomito",
            "diarreia",
            "falta_ar_moderada"

        ];


        if (
            temperatura >= 39
        ) {

            return "vermelho";

        }


        if (
            vermelhos.includes(
                sintoma
            )
        ) {

            return "vermelho";

        }


        if (
            temperatura >= 38
        ) {

            return "amarelo";

        }


        if (
            amarelos.includes(
                sintoma
            )
        ) {

            return "amarelo";

        }


        return "verde";

    }


    /* =====================================
       SALVAR TRIAGEM
    ====================================== */

    async function salvar() {

        if (
            !pacienteSelecionado
        ) {

            alert(
                "Selecione um paciente da fila primeiro."
            );

            return;

        }


        const sintoma =
            document
                .getElementById(
                    "sintoma"
                )
                .value;


        const temperatura =
            Number(
                document
                    .getElementById(
                        "temp"
                    )
                    .value
            );


        const alergia =
            document
                .getElementById(
                    "alergia"
                )
                .value;


        const observacao =
            document
                .getElementById(
                    "observacao"
                )
                .value;


        const risco =
            classificarRisco(
                sintoma,
                temperatura
            );


        try {

            const resposta =
                await fetch(
                    "/triagem",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                pacienteId:
                                    pacienteSelecionado.id,

                                nome:
                                    pacienteSelecionado.nome,

                                sintoma,

                                temperatura,

                                alergia,

                                observacao,

                                risco

                            })

                    }
                );


            if (!resposta.ok) {

                throw new Error();

            }


            const data =
                await resposta.json();


            const resultado =
                document.getElementById(
                    "resultado"
                );


            resultado.className =
                "ativo " +
                risco;


            resultado.innerHTML =

                "Classificação de risco: " +
                risco.toUpperCase();


            alert(
                "Triagem salva com sucesso!"
            );


            pacienteSelecionado =
                null;


            document
                .getElementById(
                    "pacienteSelecionado"
                )
                .classList.remove(
                    "ativo"
                );


            document
                .getElementById(
                    "formulario"
                );


            document
                .getElementById(
                    "nome"
                )
                .value = "";


            document
                .getElementById(
                    "sintoma"
                )
                .value = "";


            document
                .getElementById(
                    "temp"
                )
                .value = "";


            document
                .getElementById(
                    "alergia"
                )
                .value = "";


            document
                .getElementById(
                    "observacao"
                )
                .value = "";


            carregarPacientes();


        } catch (erro) {

            console.error(
                erro
            );


            alert(
                "Não foi possível salvar a triagem."
            );

        }

    }


    /* =====================================
       SEGURANÇA DO HTML
    ====================================== */

    function escapeHTML(
        valor
    ) {

        return String(valor)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================
       INICIALIZAÇÃO
    ====================================== */

    carregarPacientes();


    setInterval(
        carregarPacientes,
        5000
    );


</script>


</body>

</html>
